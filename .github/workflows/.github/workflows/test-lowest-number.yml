
name: Test Lowest Number Application

on:
  push:

jobs:
  test-lowest-number:
    name: Run Python Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test 1 - Ten Numbers
        run: |
          python3 find_lowest_number.py test_data/test1_input.txt test1_actual.txt
          diff test_data/test1_expected.txt test1_actual.txt

      - name: Test 2 - One Number
        run: |
          python3 find_lowest_number.py test_data/test2_input.txt test2_actual.txt
          diff test_data/test2_expected.txt test2_actual.txt

      - name: Test 3 - Empty File
        run: |
          python3 find_lowest_number.py test_data/test3_input.txt test3_actual.txt
          diff test_data/test3_expected.txt test3_actual.txt
